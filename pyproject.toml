[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-gate"
version = "0.1.0"
description = "Check an AI agent's tool call against a written boundary contract before it runs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Riftform LLC" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["rift_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
